name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: TypeScript (web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  python:
    name: Python (analysis package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy matplotlib pytest yfinance
      - run: pytest -q
